[project]
name = "serveur-utcp-outlook"
version = "0.1.0"
description = "Fournisseur UTCP outlook : sert sur GET /utcp le manuel de Microsoft Graph (courrier, agenda, contacts)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]
# Script outils/obtenir_jeton.py (flux device code Microsoft Entra ID).
jeton = ["msal>=1.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["serveur_utcp_outlook"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

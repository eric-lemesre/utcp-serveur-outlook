name: ci
on:
  push:
  pull_request:
env:
  # Dépôt parent qui porte le validateur.
  UTCP_PARENT_RAW: https://raw.githubusercontent.com/eric-lemesre/utcp-serveurs/main
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - name: Récupérer le validateur du dépôt parent
        run: curl -fsSL "$UTCP_PARENT_RAW/tools/valider_manuel.py" -o /tmp/valider_manuel.py
      - name: Valider le manuel (URL fictives)
        run: >-
          python3 -I /tmp/valider_manuel.py utcp/manual.json
          --var GRAPH_BASE=https://graph.microsoft.com/v1.0
          --var BASE_URL=https://validation.invalid
          --strict
